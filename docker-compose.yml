version: "3.9"

# The app uses SQLite for its relational database (no Postgres needed).
# The only service required for local dev is Qdrant, the vector database used
# for semantic search / RAG.  Start it with:  docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-meeting-copilot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API — set QDRANT_URL=http://localhost:6333
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
